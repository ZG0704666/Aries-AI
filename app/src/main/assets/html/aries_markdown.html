<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aries Markdown</title>

    <!-- KaTeX CSS (local) -->
    <link rel="stylesheet" href="file:///android_asset/html/vendor/katex/katex.min.css">

    <!-- Highlight.js theme -->
    <link id="hljs-theme" rel="stylesheet" href="file:///android_asset/html/vendor/atom-one-dark.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: {{ON_SURFACE_COLOR}};
            background: transparent;
            padding: 0;
            margin: 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        #content {
            padding: 0;
        }

        /* Typography */
        h1 { margin-top: 20px; margin-bottom: 12px; font-weight: 700; line-height: 1.3; font-size: 1.6em; border-bottom: 1px solid {{OUTLINE_VARIANT_COLOR}}; padding-bottom: 6px; }
        h2 { margin-top: 18px; margin-bottom: 10px; font-weight: 700; line-height: 1.3; font-size: 1.4em; border-bottom: 1px solid {{OUTLINE_VARIANT_COLOR}}; padding-bottom: 6px; }
        h3 { margin-top: 16px; margin-bottom: 8px; font-weight: 700; line-height: 1.3; font-size: 1.2em; }
        h4 { margin-top: 14px; margin-bottom: 6px; font-weight: 700; line-height: 1.3; font-size: 1.1em; }
        h5 { margin-top: 12px; margin-bottom: 6px; font-weight: 600; line-height: 1.3; font-size: 1.05em; }
        h6 { margin-top: 10px; margin-bottom: 6px; font-weight: 600; line-height: 1.3; font-size: 1em; color: {{ON_SURFACE_VARIANT_COLOR}}; }

        p {
            margin-bottom: 12px;
        }

        p:last-child {
            margin-bottom: 0;
        }

        /* Inline code */
        code {
            background: {{SURFACE_VARIANT_COLOR}};
            border-radius: 4px;
            font-size: 0.88em;
            padding: 0.15em 0.4em;
            font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;
        }

        /* Code blocks */
        pre {
            position: relative;
            background: #282c34;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid {{OUTLINE_VARIANT_COLOR}};
        }

        pre code {
            background: transparent;
            border: 0;
            display: block;
            padding: 12px 14px;
            margin: 0;
            overflow-x: auto;
            color: #abb2bf;
            white-space: pre;
        }

        /* Code block header */
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background: #21252b;
            border-bottom: 1px solid #383c44;
            border-radius: 8px 8px 0 0;
            font-size: 12px;
            color: #9da5b4;
        }

        .code-lang {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-btn {
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 4px;
            background: #383c44;
            color: #abb2bf;
            border: none;
            font-size: 12px;
            transition: background 0.2s;
        }

        .copy-btn:active {
            background: #4d78cc;
            color: #fff;
        }

        /* Tables */
        table {
            border-collapse: collapse;
            border-spacing: 0;
            width: 100%;
            margin: 12px 0;
            display: block;
            overflow-x: auto;
        }

        table th, table td {
            border: 1px solid {{OUTLINE_VARIANT_COLOR}};
            padding: 8px 12px;
            text-align: left;
        }

        table th {
            background: {{SURFACE_VARIANT_COLOR}};
            font-weight: 600;
        }

        table tr:nth-child(2n) {
            background: {{SURFACE_VARIANT_COLOR_ALPHA}};
        }

        /* Lists */
        ul, ol {
            margin: 8px 0;
            padding-left: 1.8em;
        }

        li {
            margin-bottom: 4px;
        }

        li > p {
            margin-bottom: 4px;
        }

        /* Nested lists */
        li > ul, li > ol {
            margin: 2px 0;
        }

        /* Blockquotes */
        blockquote {
            border-left: 4px solid {{PRIMARY_COLOR}};
            color: {{ON_SURFACE_VARIANT_COLOR}};
            margin: 10px 0;
            padding: 4px 16px;
            background: {{SURFACE_VARIANT_COLOR_ALPHA}};
            border-radius: 0 6px 6px 0;
        }

        blockquote p:last-child {
            margin-bottom: 0;
        }

        /* Links */
        a {
            color: {{PRIMARY_COLOR}};
            text-decoration: none;
        }

        a:hover, a:active {
            text-decoration: underline;
        }

        /* Images */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin: 8px 0;
        }

        /* Horizontal rules */
        hr {
            background: {{OUTLINE_VARIANT_COLOR}};
            border: 0;
            height: 1px;
            margin: 20px 0;
        }

        /* KaTeX math */
        .katex {
            font-size: 1.05em;
        }

        .katex-display {
            margin: 12px 0;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px 0;
        }

        .katex-display > .katex {
            white-space: normal;
        }

        /* Mermaid diagrams */
        .mermaid {
            text-align: center;
            margin: 16px 0;
            overflow-x: auto;
        }

        .mermaid svg {
            max-width: 100%;
        }

        /* Task lists */
        .task-list-item {
            list-style-type: none;
            margin-left: -1.5em;
        }

        .task-list-item input[type="checkbox"] {
            margin-right: 6px;
            pointer-events: none;
        }

        /* Strikethrough */
        del, s {
            text-decoration: line-through;
            color: {{ON_SURFACE_VARIANT_COLOR}};
        }

        /* Strong & emphasis */
        strong {
            font-weight: 700;
        }

        em {
            font-style: italic;
        }

        /* Mark / highlight */
        mark {
            background: #fff3cd;
            padding: 0.1em 0.2em;
            border-radius: 2px;
        }

        /* Streaming cursor */
        .stream-cursor {
            display: inline;
            animation: blink 0.8s step-end infinite;
            color: {{PRIMARY_COLOR}};
            font-weight: 300;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="content"></div>

    <!-- Vendor libraries (UMD/IIFE, loaded synchronously) -->
    <script src="file:///android_asset/html/vendor/markdown-it.min.js"></script>
    <script src="file:///android_asset/html/vendor/markdown-it-task-lists.min.js"></script>
    <script src="file:///android_asset/html/vendor/markdown-it-texmath.min.js"></script>
    <script src="file:///android_asset/html/vendor/katex/katex.min.js"></script>
    <script src="file:///android_asset/html/vendor/highlight.min.js"></script>
    <script src="file:///android_asset/html/vendor/mermaid.min.js"></script>

    <script>
        // ==========================================
        // Aries AI Markdown Renderer
        // ==========================================

        // Initialize markdown-it with plugins
        var md = window.markdownit({
            html: true,
            xhtmlOut: false,
            breaks: true,
            langPrefix: 'language-',
            linkify: true,
            typographer: false,
            highlight: function(str, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        var highlighted = hljs.highlight(str, { language: lang, ignoreIllegals: true }).value;
                        return '<div class="code-header"><span class="code-lang">' + escapeHtml(lang) + '</span>'
                             + '<button class="copy-btn" onclick="copyCode(this)">复制</button></div>'
                             + '<pre class="hljs"><code>' + highlighted + '</code></pre>';
                    } catch (e) { /* fallback below */ }
                }
                // No language or unknown language
                var escaped = escapeHtml(str);
                var langLabel = lang ? escapeHtml(lang) : 'code';
                return '<div class="code-header"><span class="code-lang">' + langLabel + '</span>'
                     + '<button class="copy-btn" onclick="copyCode(this)">复制</button></div>'
                     + '<pre class="hljs"><code>' + escaped + '</code></pre>';
            }
        });

        // Enable task lists
        if (typeof markdownitTaskLists !== 'undefined') {
            md.use(markdownitTaskLists, { enabled: true, label: true, labelAfter: true });
        }

        // Enable math (LaTeX) via texmath + KaTeX
        if (typeof texmath !== 'undefined' && typeof katex !== 'undefined') {
            md.use(texmath, {
                engine: katex,
                delimiters: 'dollars',
                katexOptions: { throwOnError: false, errorColor: '#cc0000' }
            });
        }

        // Custom fence renderer for mermaid diagrams
        var defaultFence = md.renderer.rules.fence;
        if (!defaultFence) {
            defaultFence = function(tokens, idx, options, env, renderer) {
                return renderer.renderToken(tokens, idx, options);
            };
        }

        md.renderer.rules.fence = function(tokens, idx, options, env, renderer) {
            var token = tokens[idx];
            var info = token.info ? token.info.trim() : '';
            if (info === 'mermaid') {
                var id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
                return '<div class="mermaid" id="' + id + '">' + escapeHtml(token.content.trim()) + '</div>\n';
            }
            // For code blocks, wrap the output of the highlight function
            // The highlight function already returns <pre><code>...</code></pre>
            // So we just return it directly here
            if (options.highlight) {
                var result = options.highlight(token.content, info);
                if (result) {
                    // The highlight function returns the full HTML including wrapper
                    return '<div class="code-block-wrapper">' + result + '</div>\n';
                }
            }
            return defaultFence(tokens, idx, options, env, renderer);
        };

        // Initialize mermaid
        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({
                startOnLoad: false,
                theme: '{{MERMAID_THEME}}',
                securityLevel: 'loose',
                fontFamily: 'inherit',
                flowchart: { useMaxWidth: true },
                sequence: { useMaxWidth: true }
            });
        }

        // ==========================================
        // Helper functions
        // ==========================================

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;');
        }

        function preprocessLatex(content) {
            // Convert \[ ... \] to $$ ... $$ (block math)
            content = content.replace(/\\\[([\s\S]*?)\\\]/g, function(match, inner) {
                return '\n$$\n' + inner.trim() + '\n$$\n';
            });
            // Convert \( ... \) to $ ... $ (inline math)
            content = content.replace(/\\\(([\s\S]*?)\\\)/g, function(match, inner) {
                return '$' + inner + '$';
            });
            return content;
        }

        // Base64 decode (supports UTF-8)
        function b64decode(str) {
            try {
                return decodeURIComponent(atob(str).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
            } catch (e) {
                return atob(str);
            }
        }

        // Copy code block content
        function copyCode(btn) {
            var wrapper = btn.closest('.code-block-wrapper');
            if (!wrapper) return;
            var code = wrapper.querySelector('pre code');
            if (!code) return;
            var text = code.textContent || code.innerText;
            if (window.AriesBridge) {
                window.AriesBridge.onCodeCopy(text);
                btn.textContent = '已复制';
                setTimeout(function() { btn.textContent = '复制'; }, 1500);
            }
        }

        // Report content height to Android
        function reportHeight() {
            var content = document.getElementById('content');
            if (content && window.AriesBridge) {
                var height = content.offsetHeight;
                window.AriesBridge.onHeightChanged(height);
            }
        }

        // ==========================================
        // Main render function (called from Android)
        // ==========================================

        var _rawMarkdown = '';
        var _streamBuffer = '';
        var _streamRenderTimer = null;
        var _streamRendering = false;
        var _isStreaming = false;

        function renderMarkdown(base64Content) {
            try {
                _rawMarkdown = b64decode(base64Content);
                _isStreaming = false;
                _doRender(_rawMarkdown, true);
            } catch (error) {
                console.error('Render error:', error);
                document.getElementById('content').innerHTML =
                    '<p style="color:#cc0000;">Render error: ' + escapeHtml(error.message) + '</p>';
                reportHeight();
            }
        }

        /**
         * Called from Android during streaming to append a delta chunk.
         * Uses debounced rendering to avoid excessive re-renders.
         */
        function appendStreamDelta(base64Delta) {
            try {
                var delta = b64decode(base64Delta);
                _streamBuffer += delta;
                _rawMarkdown = _streamBuffer;
                _isStreaming = true;

                // Debounce: render at most every 80ms during streaming
                if (!_streamRenderTimer) {
                    _streamRenderTimer = setTimeout(function() {
                        _streamRenderTimer = null;
                        _doRender(_streamBuffer, false);
                    }, 80);
                }
            } catch (e) {
                console.error('Stream delta error:', e);
            }
        }

        /**
         * Called from Android when streaming is complete.
         * Does a final full render with mermaid support.
         */
        function finishStream() {
            _isStreaming = false;
            if (_streamRenderTimer) {
                clearTimeout(_streamRenderTimer);
                _streamRenderTimer = null;
            }
            _rawMarkdown = _streamBuffer;
            _doRender(_streamBuffer, true);
        }

        /**
         * Reset streaming state for a new message.
         */
        function resetStream() {
            _streamBuffer = '';
            _rawMarkdown = '';
            _isStreaming = false;
            if (_streamRenderTimer) {
                clearTimeout(_streamRenderTimer);
                _streamRenderTimer = null;
            }
            document.getElementById('content').innerHTML = '';
            reportHeight();
        }

        /**
         * Internal render function.
         * @param {string} content - raw markdown
         * @param {boolean} finalize - if true, also render mermaid diagrams and bind links
         */
        function _doRender(content, finalize) {
            if (_streamRendering) return;
            _streamRendering = true;
            try {
                var processed = preprocessLatex(content);

                // During streaming, add a blinking cursor at the end
                var cursorHtml = '';
                if (_isStreaming) {
                    cursorHtml = '<span class="stream-cursor">▍</span>';
                }

                var html = md.render(processed);
                document.getElementById('content').innerHTML = html + cursorHtml;

                if (finalize) {
                    // Handle external links
                    var links = document.querySelectorAll('a[href^="http"]');
                    for (var i = 0; i < links.length; i++) {
                        links[i].addEventListener('click', function(e) {
                            e.preventDefault();
                            if (window.AriesBridge) {
                                window.AriesBridge.onLinkClicked(this.href);
                            }
                        });
                    }

                    // Render mermaid diagrams
                    if (typeof mermaid !== 'undefined') {
                        var mermaidElements = document.querySelectorAll('.mermaid');
                        if (mermaidElements.length > 0) {
                            mermaid.run({ nodes: mermaidElements }).then(function() {
                                reportHeight();
                            }).catch(function(err) {
                                console.warn('Mermaid render error:', err);
                                reportHeight();
                            });
                        } else {
                            reportHeight();
                        }
                    } else {
                        reportHeight();
                    }
                } else {
                    reportHeight();
                }
            } catch (error) {
                console.error('Render error:', error);
            } finally {
                _streamRendering = false;
            }
        }

        function getRawMarkdown() {
            return _rawMarkdown;
        }

        // Observe content changes for height updates
        if (typeof MutationObserver !== 'undefined') {
            var observer = new MutationObserver(function() {
                setTimeout(reportHeight, 50);
            });
            observer.observe(document.getElementById('content'), {
                childList: true, subtree: true, attributes: true
            });
        }

        // Report height after images load
        document.addEventListener('load', function(e) {
            if (e.target.tagName === 'IMG') {
                reportHeight();
            }
        }, true);

        // Signal ready to Android
        if (window.AriesBridge) {
            window.AriesBridge.onReady();
        }
    </script>
</body>
</html>
