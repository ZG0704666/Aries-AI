# 全工程 Gradle 配置。
# 通过 IDE（如 Android Studio）配置的 Gradle 设置会覆盖本文件中的同名配置。
# 关于构建环境的更多细节可访问：
# http://www.gradle.org/docs/current/userguide/build_environment.html
# 指定 Gradle 守护进程使用的 JVM 参数，主要用于调整内存上限。
# 由于依赖中存在体积较大的库（如 iText PDF），此处提升了内存上限。
org.gradle.jvmargs=-Xmx2048m -Xms512m -Dfile.encoding=UTF-8
# 启用后 Gradle 将以实验性并行模式运行，仅适用于解耦项目，详见：
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# 启用 AndroidX 包结构，便于区分 Android 系统自带包与应用 APK 内的包。
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# 指定本项目使用的 Kotlin 代码风格：official 或 obsolete。
kotlin.code.style=official
# 让各库的 R 类仅包含自身声明的资源，避免引入依赖项的资源，从而缩小 R 类体积。
android.nonTransitiveRClass=true
kotlin.dsl.disable.source.navigation=true
# 启用 Gradle 守护进程以提升构建性能。
org.gradle.daemon=true
# 本地工作目录路径含非 ASCII 字符，需要此开关绕过路径检查。
# AGP 在本地构建时会提示此实验性属性；CI 环境无需启用。
android.overridePathCheck=true
# KSP 生成源通过 kotlin.sourceSets 注册，需保持该兼容开关。
android.disallowKotlinSourceSets=false
kotlin.compiler.execution.strategy=in-process
# 关闭 AGP 9 内置 Kotlin 与新版 DSL，改用外部 KGP 2.4.21 与现有 DSL。
android.builtInKotlin=false
android.newDsl=false
